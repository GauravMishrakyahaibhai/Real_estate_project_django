<div class="col-12 col-sm-6 col-lg-4 property-item" data-search="{{ p.title|lower }} {{ p.city|lower }} {{ p.address|lower }}">
  <div class="card h-100 shadow-sm property-card">
    <div class="ratio ratio-4x3">
      {% if p.image %}
        <img src="{{ p.image.url }}" class="card-img-top object-fit-cover" alt="{{ p.title }}" loading="lazy">
      {% else %}
        <div class="d-flex align-items-center justify-content-center bg-secondary-subtle fs-1">🏠</div>
      {% endif %}
    </div>
    <div class="card-body d-flex flex-column">
      <h5 class="card-title text-truncate">{{ p.title }}</h5>
      <p class="text-body-secondary small mb-2">📍 {{ p.city }}</p>
      <p class="fw-bold fs-5 text-primary mb-2">₹{{ p.price|floatformat:"0g" }}</p>
      <p class="small text-body-secondary mb-3">🛏 {{ p.bedrooms }} Bed · 🛁 {{ p.bathrooms }} Bath</p>
      <a href="{% url 'property_detail' p.id %}" class="btn btn-primary mt-auto">View Details</a>
    </div>
  </div>
</div>
