{% extends "base.html" %}
{% block title %}Delete Property{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body p-4 text-center">
        <h1 class="h4 mb-3">Delete "{{ property.title }}"?</h1>
        <p class="text-body-secondary">This will also delete all enquiries for this property. This cannot be undone.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a href="{% url 'property_detail' property.id %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
